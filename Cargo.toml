[package]
name = "mirako"
version = "0.2.1"
edition = "2021"
description = "Remote builds: sync the project to another machine over ssh (content-hash delta, zstd), run the command there, pull the outputs back."
license = "MIT"
repository = "https://github.com/Nam0101/mirako"
readme = "README.md"
keywords = ["remote-build", "ssh", "gradle", "android", "sync"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[dependencies]
anyhow = "1"
bincode = "1.3"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
filetime = "0.2"
globset = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
toml = "0.8"
walkdir = "2"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
