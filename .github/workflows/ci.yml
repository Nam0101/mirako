# Runs on the self-hosted runner on the m4 (labels: self-hosted, macOS, ARM64, m4).
# The runner's user has rustup in ~/.cargo; the service does not source a shell profile,
# so every job puts ~/.cargo/bin on PATH first. One runner, so stale PR runs are cancelled.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: [self-hosted, macOS, ARM64, m4]
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustc --version && cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  bench:
    name: criterion
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, m4]
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # criterion keeps the previous run under target/criterion on this runner, so the
      # output includes the change against the last main push
      - run: cargo bench 2>&1 | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: |
            bench.txt
            target/criterion
          retention-days: 30

  release:
    name: release binary
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, macOS, ARM64, m4]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: the tag must match Cargo.toml (the protocol version)
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but Cargo.toml says $v"; exit 1; }
      - run: cargo build --release
      - run: |
          mkdir -p dist
          cp target/release/mirako "dist/mirako-${GITHUB_REF_NAME}-macos-arm64"
          (cd dist && shasum -a 256 * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mirako-${{ github.ref_name }}-macos-arm64
          path: dist
      - run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
